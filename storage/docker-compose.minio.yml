# Object store (MinIO) como serviço EXTERNO, sempre no ar (fora do compose do
# ambiente Spark). Guarda os dados-fonte (read-only) e persiste entre execuções.
# O Spark o encontra pela rede externa compartilhada `external-net`, resolvendo o
# host `s3`.
#
# Pré-requisito (uma vez): docker network create external-net
# Subir:                   docker compose -f docker-compose.minio.yml up -d
#
# Nome de projeto FIXO e próprio: impede que o compose do Spark (nomeado pela
# pasta) trate este serviço como "órfão" e o apague num `down --remove-orphans`.
name: datalake-minio

services:

  s3:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin1234}
    # Portas do HOST configuráveis (default deslocado para 19000/19001 e assim não
    # bater com outro serviço na 9000/9001). A porta INTERNA continua 9000/9001,
    # então o Spark e os scripts (que falam com `s3:9000` PELA REDE) não mudam nada.
    # Só afeta o acesso pelo navegador/host. Sobrescreva com MINIO_API_PORT/CONSOLE_PORT.
    ports:
      - "${MINIO_API_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio-data:/data
    networks:
      - external-net

  s3-init:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    depends_on:
      s3:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin1234}
      S3_BUCKET: ${S3_BUCKET:-datalake}
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://s3:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}) do echo 'waiting for s3...'; sleep 2; done;
      mc mb --ignore-existing local/$${S3_BUCKET};
      mc anonymous set none local/$${S3_BUCKET};
      echo 'bucket ready (private): '$${S3_BUCKET};
      "
    networks:
      - external-net

volumes:
  minio-data:

networks:
  external-net:
    external: true
