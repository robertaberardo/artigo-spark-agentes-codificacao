[data_lake]
db  = "datalake"
app = "snis"

# ---------------------------------------------------------------------------
# snis_municipio — municípios atendidos (população de referência)
# ---------------------------------------------------------------------------
[tables.municipio]
name   = "snis_municipio"
levels = ["raw", "bronze"]
key    = "municipio_ibge"

[[tables.municipio.raw.schema]]
name = "municipio_ibge"
type = "string"
description = "código IBGE do município (chave)"

[[tables.municipio.raw.schema]]
name = "nome"
type = "string"
description = "nome do município"

[[tables.municipio.raw.schema]]
name = "uf"
type = "string"
description = "sigla da UF"

[[tables.municipio.raw.schema]]
name = "populacao"
type = "string"
description = "população residente (texto)"

[[tables.municipio.bronze.schema]]
name = "municipio_ibge"
type = "string"
description = "código IBGE do município, com sete dígitos (chave)"

[[tables.municipio.bronze.schema]]
name = "nome"
type = "string"
description = "nome do município (espaçamento padronizado)"

[[tables.municipio.bronze.schema]]
name = "uf"
type = "string"
description = "sigla da UF"

[[tables.municipio.bronze.schema]]
name = "populacao"
type = "long"
description = "população residente"

# ---------------------------------------------------------------------------
# snis_prestador — prestadores de serviço de saneamento
# ---------------------------------------------------------------------------
[tables.prestador]
name   = "snis_prestador"
levels = ["raw", "bronze"]
