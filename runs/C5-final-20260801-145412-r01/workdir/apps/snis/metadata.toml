[[tables.prestador.raw.schema]]
name = "codigo"
type = "string"
description = "código do prestador (chave)"

[[tables.prestador.raw.schema]]
name = "nome"
type = "string"
description = "nome do prestador"

[[tables.prestador.raw.schema]]
name = "uf"
type = "string"
description = "UF da sede"

[[tables.prestador.raw.schema]]
name = "natureza_juridica"
type = "string"
description = "natureza jurídica do prestador"

[[tables.prestador.raw.schema]]
name = "abrangencia"
type = "string"
description = "abrangência de atuação (municipal, microrregional, regional)"

[[tables.prestador.bronze.schema]]
name = "codigo"
type = "string"
description = "código do prestador (chave)"

[[tables.prestador.bronze.schema]]
name = "nome"
type = "string"
description = "nome do prestador (espaçamento padronizado)"

[[tables.prestador.bronze.schema]]
name = "uf"
type = "string"
description = "UF da sede"

[[tables.prestador.bronze.schema]]
name = "natureza_juridica"
type = "string"
description = "natureza jurídica do prestador"

[[tables.prestador.bronze.schema]]
name = "abrangencia"
type = "string"
description = "abrangência de atuação"

