# ---------------------------------------------------------------------------
# cvm_cota_serie — série de cotas enriquecida por fundo (silver)
# ---------------------------------------------------------------------------
[tables.cota_serie]
name   = "cvm_cota_serie"
levels = ["silver"]
key    = "cnpj_fundo"

[[tables.cota_serie.silver.schema]]
name = "cnpj_fundo"
type = "string"
description = "CNPJ do fundo (chave)"

[[tables.cota_serie.silver.schema]]
name = "data"
type = "date"
description = "data de referência"

[[tables.cota_serie.silver.schema]]
