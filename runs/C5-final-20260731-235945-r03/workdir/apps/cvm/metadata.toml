[data_lake]
db  = "datalake"
app = "cvm"

# ---------------------------------------------------------------------------
# cvm_fundo — cadastro dos fundos de investimento
# ---------------------------------------------------------------------------
[tables.fundo]
name   = "cvm_fundo"
levels = ["raw", "bronze"]
key    = "cnpj"

[[tables.fundo.raw.schema]]
name = "cnpj"
type = "string"
description = "CNPJ do fundo (chave)"

[[tables.fundo.raw.schema]]
name = "nome"
type = "string"
description = "denominação social do fundo"

[[tables.fundo.raw.schema]]
name = "classe"
type = "string"
description = "classe CVM do fundo"

[[tables.fundo.raw.schema]]
name = "situacao"
type = "string"
description = "situação cadastral"

[[tables.fundo.raw.schema]]
name = "data_registro"
type = "string"
description = "data de registro (dd/MM/yyyy, texto)"

[[tables.fundo.bronze.schema]]
name = "cnpj"
type = "string"
description = "CNPJ do fundo (chave)"

[[tables.fundo.bronze.schema]]
name = "nome"
type = "string"
description = "denominação social (espaçamento padronizado)"

[[tables.fundo.bronze.schema]]
name = "classe"
type = "string"
description = "classe CVM (espaçamento padronizado)"

[[tables.fundo.bronze.schema]]
name = "situacao"
type = "string"
description = "situação cadastral"

[[tables.fundo.bronze.schema]]
name = "data_registro"
type = "date"
description = "data de registro"

# ---------------------------------------------------------------------------
# cvm_cota — série diária de cotas por fundo
# ---------------------------------------------------------------------------
[tables.cota]
name   = "cvm_cota"
levels = ["raw", "bronze"]
key    = "cnpj_fundo"

[[tables.cota.raw.schema]]
name = "cnpj_fundo"
type = "string"
description = "CNPJ do fundo (chave)"

[[tables.cota.raw.schema]]
name = "data"
type = "string"
description = "data de referência (dd/MM/yyyy, texto)"

[[tables.cota.raw.schema]]
name = "valor_cota"
type = "string"
description = "valor da cota (texto)"

[[tables.cota.raw.schema]]
name = "patrimonio_liquido"
type = "string"
description = "patrimônio líquido (R$ 1.234,56, texto)"

[[tables.cota.raw.schema]]
name = "cotistas"
type = "string"
description = "número de cotistas (texto)"

[[tables.cota.bronze.schema]]
name = "cnpj_fundo"
type = "string"
description = "CNPJ do fundo (chave)"

[[tables.cota.bronze.schema]]
name = "data"
type = "date"
description = "data de referência"

[[tables.cota.bronze.schema]]
name = "valor_cota"
type = "double"
description = "valor da cota"

[[tables.cota.bronze.schema]]
name = "patrimonio_liquido"
type = "double"
description = "patrimônio líquido em reais"

[[tables.cota.bronze.schema]]
name = "cotistas"
type = "long"
description = "número de cotistas"

# ---------------------------------------------------------------------------
# cvm_informe_diario — captação e resgate diários por fundo
# ---------------------------------------------------------------------------
[tables.informe_diario]
name   = "cvm_informe_diario"
levels = ["raw", "bronze"]
