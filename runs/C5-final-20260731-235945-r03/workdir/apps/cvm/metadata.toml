description = "CNPJ do fundo (chave)"

[[tables.informe_diario.raw.schema]]
name = "data"
type = "string"
description = "data de referência (dd/MM/yyyy, texto)"

[[tables.informe_diario.raw.schema]]
name = "captacao"
type = "string"
description = "captação do dia (R$ ..., texto)"

[[tables.informe_diario.raw.schema]]
name = "resgate"
type = "string"
description = "resgate do dia (R$ ..., texto)"

[[tables.informe_diario.bronze.schema]]
name = "cnpj_fundo"
type = "string"
description = "CNPJ do fundo (chave)"

[[tables.informe_diario.bronze.schema]]
name = "data"
type = "date"
description = "data de referência"

[[tables.informe_diario.bronze.schema]]
name = "captacao"
type = "double"
description = "captação do dia em reais"

[[tables.informe_diario.bronze.schema]]
name = "resgate"
type = "double"
description = "resgate do dia em reais"

