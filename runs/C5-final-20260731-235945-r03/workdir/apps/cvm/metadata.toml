# ---------------------------------------------------------------------------
# cvm_ranking_fundos — ranking de fundos por patrimônio (gold)
# ---------------------------------------------------------------------------
[tables.ranking_fundos]
name   = "cvm_ranking_fundos"
levels = ["gold"]
key    = "cnpj_fundo"

[[tables.ranking_fundos.gold.schema]]
name = "cnpj_fundo"
type = "string"
description = "CNPJ do fundo (chave)"

[[tables.ranking_fundos.gold.schema]]
name = "patrimonio_liquido"
type = "double"
description = "patrimônio líquido mais recente"

[[tables.ranking_fundos.gold.schema]]
name = "cotistas"
type = "long"
description = "número de cotistas mais recente"

[[tables.ranking_fundos.gold.schema]]
name = "rank_patrimonio"
type = "int"
description = "posição por patrimônio (1 = maior)"

# ---------------------------------------------------------------------------
# cvm_patrimonio_por_classe — patrimônio agregado por classe (gold)
# ---------------------------------------------------------------------------
[tables.patrimonio_por_classe]
name   = "cvm_patrimonio_por_classe"
