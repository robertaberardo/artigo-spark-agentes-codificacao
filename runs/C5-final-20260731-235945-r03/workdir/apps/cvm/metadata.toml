key    = "classe"

[[tables.patrimonio_por_classe.gold.schema]]
name = "classe"
type = "string"
description = "classe CVM (chave)"

[[tables.patrimonio_por_classe.gold.schema]]
name = "fundos"
type = "long"
description = "número de fundos na classe"

[[tables.patrimonio_por_classe.gold.schema]]
name = "patrimonio_total"
type = "double"
description = "patrimônio líquido total da classe"

[[tables.patrimonio_por_classe.gold.schema]]
name = "participacao"
type = "double"
description = "participação da classe no patrimônio total"
