type = "geometry(point)"
description = "ponto da zona eleitoral (EPSG:3857)"

# ---------------------------------------------------------------------------
# tse_municipio_geo — municípios como polígono, com área (silver)
# ---------------------------------------------------------------------------
[tables.municipio_geo]
