[data_lake]
db  = "datalake"
app = "tse"

# ---------------------------------------------------------------------------
# tse_candidato — candidatos e votos totalizados na fonte
# ---------------------------------------------------------------------------
[tables.candidato]
name   = "tse_candidato"
levels = ["raw", "bronze"]
key    = "id_candidato"

[[tables.candidato.raw.schema]]
name = "id_candidato"
type = "string"
description = "identificador do candidato (chave)"

[[tables.candidato.raw.schema]]
name = "nome"
type = "string"
description = "nome de urna do candidato"

[[tables.candidato.raw.schema]]
name = "partido_sigla"
type = "string"
description = "sigla do partido"

[[tables.candidato.raw.schema]]
name = "uf"
type = "string"
description = "UF da candidatura"

[[tables.candidato.raw.schema]]
name = "cargo"
type = "string"
description = "cargo disputado"

[[tables.candidato.raw.schema]]
name = "situacao"
type = "string"
description = "situação da candidatura"

[[tables.candidato.raw.schema]]
name = "votos"
type = "string"
description = "votos apurados (texto)"

[[tables.candidato.bronze.schema]]
name = "id_candidato"
type = "string"
description = "identificador do candidato (chave)"

[[tables.candidato.bronze.schema]]
name = "nome"
type = "string"
description = "nome de urna (espaçamento padronizado)"

[[tables.candidato.bronze.schema]]
name = "partido_sigla"
type = "string"
description = "sigla do partido"

[[tables.candidato.bronze.schema]]
name = "uf"
type = "string"
description = "UF da candidatura"

[[tables.candidato.bronze.schema]]
name = "cargo"
type = "string"
description = "cargo disputado"

[[tables.candidato.bronze.schema]]
name = "situacao"
type = "string"
description = "situação da candidatura"

[[tables.candidato.bronze.schema]]
name = "votos"
type = "int"
description = "votos apurados"

# ---------------------------------------------------------------------------
# tse_votacao — votos por candidato, município e zona
# ---------------------------------------------------------------------------
[tables.votacao]
name   = "tse_votacao"
levels = ["raw", "bronze"]
key    = "id_votacao"

[[tables.votacao.raw.schema]]
name = "id_votacao"
type = "string"
description = "identificador do registro de votação (chave)"

[[tables.votacao.raw.schema]]
name = "id_candidato"
type = "string"
description = "identificador do candidato"

[[tables.votacao.raw.schema]]
name = "municipio_ibge"
type = "string"
description = "código IBGE do município"

[[tables.votacao.raw.schema]]
name = "uf"
type = "string"
description = "sigla da UF"

[[tables.votacao.raw.schema]]
name = "zona"
type = "string"
description = "número da zona eleitoral"

[[tables.votacao.raw.schema]]
name = "votos"
type = "string"
description = "votos na urna (texto)"

[[tables.votacao.bronze.schema]]
name = "id_votacao"
type = "string"
description = "identificador do registro de votação (chave)"

[[tables.votacao.bronze.schema]]
name = "id_candidato"
type = "string"
description = "identificador do candidato"

[[tables.votacao.bronze.schema]]
name = "municipio_ibge"
type = "string"
description = "código IBGE do município (7 dígitos)"

[[tables.votacao.bronze.schema]]
name = "uf"
type = "string"
description = "sigla da UF"

[[tables.votacao.bronze.schema]]
name = "zona"
type = "string"
description = "número da zona eleitoral"

[[tables.votacao.bronze.schema]]
name = "votos"
type = "int"
description = "votos na urna"

# ---------------------------------------------------------------------------
