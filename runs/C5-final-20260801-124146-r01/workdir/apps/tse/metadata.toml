description = "polígono do município em WKT (WGS84)"

# ---------------------------------------------------------------------------
# tse_zona_geo — zonas eleitorais como ponto (silver)
# ---------------------------------------------------------------------------
[tables.zona_geo]
name   = "tse_zona_geo"
levels = ["silver"]
key    = "id_zona"

[[tables.zona_geo.silver.schema]]
name = "id_zona"
type = "string"
description = "identificador da zona eleitoral (chave)"

[[tables.zona_geo.silver.schema]]
name = "municipio_ibge"
