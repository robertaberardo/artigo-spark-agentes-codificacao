[[tables.matricula.bronze.schema]]
name = "mat_basica"
type = "int"
description = "matrículas na educação básica (total)"

[[tables.matricula.bronze.schema]]
name = "mat_infantil"
type = "int"
description = "matrículas na educação infantil"

[[tables.matricula.bronze.schema]]
name = "mat_fundamental"
type = "int"
description = "matrículas no ensino fundamental"

[[tables.matricula.bronze.schema]]
name = "mat_medio"
type = "int"
description = "matrículas no ensino médio"

[[tables.matricula.bronze.schema]]
name = "mat_profissional"
type = "int"
description = "matrículas na educação profissional"

[[tables.matricula.bronze.schema]]
name = "mat_eja"
type = "int"
description = "matrículas na educação de jovens e adultos"

[[tables.matricula.bronze.schema]]
name = "mat_especial"
type = "int"
description = "matrículas na educação especial"

# -------------------------------------------------------------------------
# educacao_escola_matricula_geo — escolas georreferenciadas com matrícula
# (silver). Escolas com coordenada válida, enriquecidas com o total de
# matrículas da educação básica; guarda setor/situação para os recortes do
# gold e mantém lat/long originais (WGS84) para os cálculos geodésicos e H3.
# -------------------------------------------------------------------------
[tables.escola_matricula_geo]
name   = "educacao_escola_matricula_geo"
levels = ["silver"]
key    = "id_unidade"

[[tables.escola_matricula_geo.silver.schema]]
name = "id_unidade"
type = "string"
description = "código da unidade escolar (chave)"

[[tables.escola_matricula_geo.silver.schema]]
name = "uf"
type = "string"
description = "sigla da UF"

[[tables.escola_matricula_geo.silver.schema]]
name = "setor"
type = "string"
description = "setor administrativo (1 federal, 2 estadual, 3 municipal, 4 privada)"

[[tables.escola_matricula_geo.silver.schema]]
name = "situacao"
type = "string"
description = "situação de funcionamento (1 em atividade, 2 paralisada, 3 extinta)"

[[tables.escola_matricula_geo.silver.schema]]
name = "latitude"
type = "double"
description = "latitude em graus decimais (WGS84 original)"

[[tables.escola_matricula_geo.silver.schema]]
name = "longitude"
type = "double"
description = "longitude em graus decimais (WGS84 original)"

[[tables.escola_matricula_geo.silver.schema]]
name = "total_enrollment"
type = "int"
description = "total de matrículas na educação básica (NULL se sem registro)"

[[tables.escola_matricula_geo.silver.schema]]
name = "geometry"
type = "geometry(point)"
description = "ponto da escola (EPSG:3857)"

# -------------------------------------------------------------------------
# educacao_escola_matricula_h3_grid — agregação por célula H3 nível 5 das
# escolas federais em atividade (gold). Vizinhas: outras federais ativas na
# própria célula ou nas células imediatamente adjacentes (k-anel 1).
# -------------------------------------------------------------------------
[tables.escola_matricula_h3_grid]
name   = "educacao_escola_matricula_h3_grid"
levels = ["gold"]
key    = "h3_cell"

[[tables.escola_matricula_h3_grid.gold.schema]]
name = "h3_cell"
type = "long"
description = "id da célula H3 nível 5 (chave)"

[[tables.escola_matricula_h3_grid.gold.schema]]
name = "n_schools"
type = "long"
description = "escolas federais em atividade na célula"

[[tables.escola_matricula_h3_grid.gold.schema]]
name = "total_enrollment"
type = "long"
description = "total de matrículas das escolas da célula"

[[tables.escola_matricula_h3_grid.gold.schema]]
name = "avg_enrollment"
type = "double"
description = "média de matrículas por escola na célula"

[[tables.escola_matricula_h3_grid.gold.schema]]
name = "n_federal_neighbors"
type = "long"
description = "nº de escolas vizinhas (mesma para toda a célula): federais ativas na própria célula ou nas adjacentes"

[[tables.escola_matricula_h3_grid.gold.schema]]
name = "avg_dist_neighbors_km"
type = "double"
description = "distância geodésica média (km) de cada escola às suas vizinhas, agregada na célula"

[[tables.escola_matricula_h3_grid.gold.schema]]
name = "avg_dist_nearest_km"
type = "double"
description = "distância geodésica média (km) de cada escola à federal ativa mais próxima (qualquer célula), agregada na célula"

[[tables.escola_matricula_h3_grid.gold.schema]]
name = "geometry"
type = "geometry(polygon)"
description = "polígono da célula H3 (EPSG:3857)"
