[data_lake]
db  = "datalake"
app = "anac"

# ---------------------------------------------------------------------------
# anac_aerodromo — cadastro dos aeródromos
# ---------------------------------------------------------------------------
[tables.aerodromo]
name   = "anac_aerodromo"
levels = ["raw", "bronze"]
key    = "codigo_oaci"

[[tables.aerodromo.raw.schema]]
name = "codigo_oaci"
type = "string"
description = "código OACI do aeródromo (chave)"

[[tables.aerodromo.raw.schema]]
name = "nome"
type = "string"
description = "nome do aeródromo"

[[tables.aerodromo.raw.schema]]
name = "municipio"
type = "string"
description = "município"

[[tables.aerodromo.raw.schema]]
name = "uf"
type = "string"
description = "sigla da UF"

[[tables.aerodromo.raw.schema]]
name = "tipo"
type = "string"
description = "público ou privado"

[[tables.aerodromo.raw.schema]]
name = "latitude"
type = "string"
description = "latitude (texto, como aterrissa)"

[[tables.aerodromo.raw.schema]]
name = "longitude"
type = "string"
description = "longitude (texto, como aterrissa)"

[[tables.aerodromo.raw.schema]]
name = "altitude_m"
type = "string"
description = "altitude em metros (texto)"

[[tables.aerodromo.bronze.schema]]
name = "codigo_oaci"
type = "string"
description = "código OACI do aeródromo (chave)"

[[tables.aerodromo.bronze.schema]]
name = "nome"
type = "string"
description = "nome do aeródromo (espaçamento padronizado)"

[[tables.aerodromo.bronze.schema]]
name = "municipio"
type = "string"
description = "município"

[[tables.aerodromo.bronze.schema]]
name = "uf"
type = "string"
description = "sigla da UF"

[[tables.aerodromo.bronze.schema]]
name = "tipo"
type = "string"
description = "público ou privado"

[[tables.aerodromo.bronze.schema]]
name = "latitude"
type = "double"
description = "latitude em graus decimais"

[[tables.aerodromo.bronze.schema]]
name = "longitude"
type = "double"
description = "longitude em graus decimais"

[[tables.aerodromo.bronze.schema]]
name = "altitude_m"
type = "double"
description = "altitude em metros"

# ---------------------------------------------------------------------------
