# ---------------------------------------------------------------------------
# anac_aerodromo_geo — aeródromos georreferenciados (silver)
# ---------------------------------------------------------------------------
[tables.aerodromo_geo]
name   = "anac_aerodromo_geo"
levels = ["silver"]
key    = "codigo_oaci"

[[tables.aerodromo_geo.silver.schema]]
name = "codigo_oaci"
type = "string"
description = "código OACI do aeródromo (chave)"

[[tables.aerodromo_geo.silver.schema]]
name = "nome"
type = "string"
description = "nome do aeródromo"

[[tables.aerodromo_geo.silver.schema]]
name = "uf"
type = "string"
description = "sigla da UF"

[[tables.aerodromo_geo.silver.schema]]
name = "tipo"
type = "string"
description = "público ou privado"

[[tables.aerodromo_geo.silver.schema]]
name = "altitude_m"
type = "double"
description = "altitude em metros"

[[tables.aerodromo_geo.silver.schema]]
