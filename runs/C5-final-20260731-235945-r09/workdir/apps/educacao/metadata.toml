[data_lake]
db  = "datalake"
app = "educacao"

# -------------------------------------------------------------------------
# educacao_escola
# -------------------------------------------------------------------------
[tables.escola]
name   = "educacao_escola"
levels = ["raw", "bronze"]
key    = "ID_UNIDADE"

[[tables.escola.raw.schema]]
name = "ID_UNIDADE"
type = "string"
description = "código da unidade escolar (chave, 8 dígitos)"

[[tables.escola.raw.schema]]
name = "NOME_UNIDADE"
type = "string"
description = "nome da unidade"

[[tables.escola.raw.schema]]
name = "UF"
type = "string"
description = "sigla da unidade federativa"

[[tables.escola.raw.schema]]
name = "COD_UF"
type = "string"
description = "código IBGE da UF"

[[tables.escola.raw.schema]]
name = "NOME_MUNICIPIO"
type = "string"
description = "nome do município"

[[tables.escola.raw.schema]]
name = "COD_MUNICIPIO"
type = "string"
description = "código IBGE do município"

[[tables.escola.raw.schema]]
name = "SETOR"
type = "string"
description = "setor administrativo (1 federal, 2 estadual, 3 municipal, 4 privada)"

[[tables.escola.raw.schema]]
name = "AREA"
type = "string"
description = "área (1 urbana, 2 rural)"

[[tables.escola.raw.schema]]
name = "SITUACAO"
type = "string"
description = "situação de funcionamento (1 em atividade, 2 paralisada, 3 extinta)"

[[tables.escola.raw.schema]]
name = "LATITUDE"
type = "string"
description = "latitude em graus decimais (texto, como aterrissa)"

[[tables.escola.raw.schema]]
name = "LONGITUDE"
type = "string"
description = "longitude em graus decimais (texto, como aterrissa)"

[[tables.escola.raw.schema]]
name = "QT_SALAS"
type = "string"
description = "quantidade de salas de aula utilizadas"

[[tables.escola.raw.schema]]
name = "TEM_AGUA"
type = "string"
description = "indicador (0/1) de fornecimento de água potável"

[[tables.escola.raw.schema]]
name = "TEM_ENERGIA"
type = "string"
description = "indicador (0/1) de energia elétrica da rede pública"

[[tables.escola.raw.schema]]
name = "TEM_ESGOTO"
type = "string"
description = "indicador (0/1) de esgotamento sanitário da rede pública"

[[tables.escola.raw.schema]]
name = "TEM_BANHEIRO"
type = "string"
description = "indicador (0/1) de banheiro"

[[tables.escola.raw.schema]]
name = "TEM_BIBLIOTECA"
type = "string"
description = "indicador (0/1) de biblioteca"

[[tables.escola.raw.schema]]
name = "TEM_LAB_INFO"
type = "string"
description = "indicador (0/1) de laboratório de informática"

[[tables.escola.raw.schema]]
name = "TEM_QUADRA"
type = "string"
description = "indicador (0/1) de quadra de esportes"

[[tables.escola.raw.schema]]
name = "TEM_INTERNET"
type = "string"
description = "indicador (0/1) de acesso à internet"

# -------------------------------------------------------------------------
# educacao_matricula
# -------------------------------------------------------------------------
[tables.matricula]
name   = "educacao_matricula"
