description = "indicador (0/1) de biblioteca"

[[tables.escola.bronze.schema]]
name = "has_computer_lab"
type = "int"
description = "indicador (0/1) de laboratório de informática"

[[tables.escola.bronze.schema]]
name = "has_sports_court"
type = "int"
description = "indicador (0/1) de quadra de esportes"

[[tables.escola.bronze.schema]]
name = "has_internet"
type = "int"
description = "indicador (0/1) de acesso à internet"

# -------------------------------------------------------------------------
# educacao_matricula — bronze
# -------------------------------------------------------------------------
[[tables.matricula.bronze.schema]]
name = "id_unidade"
type = "string"
description = "código da unidade escolar (chave)"

[[tables.matricula.bronze.schema]]
name = "enrollment_basic"
type = "int"
description = "matrículas na educação básica (total)"

[[tables.matricula.bronze.schema]]
name = "enrollment_infant"
type = "int"
description = "matrículas na educação infantil"

[[tables.matricula.bronze.schema]]
name = "enrollment_elementary"
type = "int"
description = "matrículas no ensino fundamental"

[[tables.matricula.bronze.schema]]
name = "enrollment_highschool"
type = "int"
description = "matrículas no ensino médio"

[[tables.matricula.bronze.schema]]
name = "enrollment_professional"
type = "int"
description = "matrículas na educação profissional"

[[tables.matricula.bronze.schema]]
name = "enrollment_youth_adult"
type = "int"
description = "matrículas na educação de jovens e adultos"

[[tables.matricula.bronze.schema]]
name = "enrollment_special"
type = "int"
description = "matrículas na educação especial"

# -------------------------------------------------------------------------
# educacao_escola_matricula — silver
# Escolas federais em atividade, georreferenciadas e com matrículas anexadas.
# -------------------------------------------------------------------------
[tables.escola_matricula]
name   = "educacao_escola_matricula"
levels = ["silver"]
key    = "id_unidade"

[[tables.escola_matricula.silver.schema]]
name = "id_unidade"
type = "string"
description = "código da unidade escolar (chave)"

[[tables.escola_matricula.silver.schema]]
name = "school_name"
type = "string"
description = "nome da unidade"

[[tables.escola_matricula.silver.schema]]
name = "uf"
type = "string"
description = "sigla da unidade federativa"

[[tables.escola_matricula.silver.schema]]
name = "municipality_name"
type = "string"
description = "nome do município"

[[tables.escola_matricula.silver.schema]]
name = "admin_sector"
type = "int"
description = "setor administrativo (sempre 1 federal nesta tabela)"

[[tables.escola_matricula.silver.schema]]
name = "operating_status"
type = "int"
description = "situação de funcionamento (sempre 1 em atividade nesta tabela)"

[[tables.escola_matricula.silver.schema]]
name = "enrollment"
type = "long"
description = "matrículas na educação básica (total) da escola"

[[tables.escola_matricula.silver.schema]]
name = "latitude"
type = "double"
description = "latitude em graus decimais (WGS84, preservada para medidas geodésicas)"

[[tables.escola_matricula.silver.schema]]
name = "longitude"
type = "double"
description = "longitude em graus decimais (WGS84, preservada para medidas geodésicas)"

[[tables.escola_matricula.silver.schema]]
name = "h3_cell"
type = "long"
description = "id da célula H3 (resolução 5) que contém a escola"

[[tables.escola_matricula.silver.schema]]
name = "geometry"
type = "geometry"
description = "ponto da escola em EPSG:3857 (geoparquet)"

# -------------------------------------------------------------------------
# educacao_escola_matricula_h3_grid — gold
# Agregação por célula H3 (res. 5) das escolas federais em atividade.
# -------------------------------------------------------------------------
[tables.escola_matricula_h3_grid]
name   = "educacao_escola_matricula_h3_grid"
levels = ["gold"]
key    = "h3_cell"

[[tables.escola_matricula_h3_grid.gold.schema]]
name = "h3_cell"
type = "long"
description = "id da célula H3 (resolução 5)"

[[tables.escola_matricula_h3_grid.gold.schema]]
name = "n_schools"
type = "long"
description = "quantidade de escolas federais em atividade na célula"

[[tables.escola_matricula_h3_grid.gold.schema]]
name = "total_enrollment"
type = "long"
description = "total de matrículas (educação básica) das escolas da célula"

[[tables.escola_matricula_h3_grid.gold.schema]]
name = "avg_enrollment"
type = "double"
description = "média de matrículas por escola na célula"

[[tables.escola_matricula_h3_grid.gold.schema]]
name = "n_federal_neighbors"
type = "long"
description = "quantidade de escolas federais vizinhas (própria célula + adjacentes, exceto a própria escola); igual para toda a célula"

[[tables.escola_matricula_h3_grid.gold.schema]]
name = "avg_dist_neighbors_km"
type = "double"
description = "distância geodésica média (km) de cada escola às suas vizinhas, promediada na célula"

[[tables.escola_matricula_h3_grid.gold.schema]]
name = "avg_dist_nearest_km"
type = "double"
description = "distância geodésica média (km) de cada escola à federal mais próxima (qualquer), promediada na célula"

[[tables.escola_matricula_h3_grid.gold.schema]]
name = "geometry"
type = "geometry"
description = "polígono hexagonal da célula H3 em EPSG:3857 (geoparquet)"
