# -------------------------------------------------------------------------
# educacao_escola_matricula_h3_grid (gold) — densidade de escolas federais
# em atividade por célula H3 nível 5, com estatísticas de vizinhança
# -------------------------------------------------------------------------
[tables.escola_matricula_h3_grid]
name   = "educacao_escola_matricula_h3_grid"
levels = ["gold"]
key    = "h3_cell"

[[tables.escola_matricula_h3_grid.gold.schema]]
name = "h3_cell"
type = "long"
description = "id da célula H3 (nível 5)"

[[tables.escola_matricula_h3_grid.gold.schema]]
name = "n_schools"
type = "long"
description = "quantidade de escolas federais em atividade na célula"

[[tables.escola_matricula_h3_grid.gold.schema]]
name = "total_enrollment"
type = "long"
description = "total de matrículas (educação básica) das escolas da célula"

[[tables.escola_matricula_h3_grid.gold.schema]]
name = "avg_enrollment"
type = "double"
description = "média de matrículas por escola na célula"

[[tables.escola_matricula_h3_grid.gold.schema]]
name = "n_federal_neighbors"
type = "long"
description = "quantidade de escolas vizinhas (célula + adjacentes), igual para toda a célula"

[[tables.escola_matricula_h3_grid.gold.schema]]
name = "avg_dist_neighbors_km"
type = "double"
description = "distância média (km) de cada escola às suas vizinhas"

[[tables.escola_matricula_h3_grid.gold.schema]]
name = "avg_dist_nearest_km"
type = "double"
description = "distância média (km) de cada escola à federal mais próxima (qualquer)"

[[tables.escola_matricula_h3_grid.gold.schema]]
name = "geometry"
type = "geometry"
description = "polígono da célula H3 (EPSG:4326)"

# -------------------------------------------------------------------------
