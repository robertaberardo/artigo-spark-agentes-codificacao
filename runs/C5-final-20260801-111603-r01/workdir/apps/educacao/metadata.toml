[[tables.escola.bronze.schema]]
name = "tem_internet"
type = "int"
description = "indicador (0/1) de acesso à internet"

# -------------------------------------------------------------------------
# educacao_escola_geo (silver) — escolas federais em atividade,
# georreferenciadas e com o total de matrículas anexado
# -------------------------------------------------------------------------
[tables.escola_geo]
name   = "educacao_escola_geo"
levels = ["silver"]
key    = "id_unidade"

[[tables.escola_geo.silver.schema]]
name = "id_unidade"
type = "string"
description = "código da unidade escolar (chave, 8 dígitos)"

[[tables.escola_geo.silver.schema]]
name = "uf"
type = "string"
description = "sigla da unidade federativa"

[[tables.escola_geo.silver.schema]]
name = "enrollment"
type = "int"
description = "total de matrículas na educação básica (MAT_BASICA)"

[[tables.escola_geo.silver.schema]]
name = "latitude"
type = "double"
description = "latitude WGS84, preservada para cálculo geodésico e indexação H3"

[[tables.escola_geo.silver.schema]]
name = "longitude"
type = "double"
description = "longitude WGS84, preservada para cálculo geodésico e indexação H3"

[[tables.escola_geo.silver.schema]]
name = "geometry"
type = "geometry"
description = "ponto da escola em EPSG:3857 (geometria persistida)"

