[data_lake]
db  = "datalake"
app = "ana"

# ---------------------------------------------------------------------------
# ana_estacao — cadastro das estações fluviométricas
# ---------------------------------------------------------------------------
[tables.estacao]
name   = "ana_estacao"
levels = ["raw", "bronze"]
key    = "codigo"

[[tables.estacao.raw.schema]]
name = "codigo"
type = "string"
description = "código da estação (chave)"

[[tables.estacao.raw.schema]]
name = "nome"
type = "string"
description = "nome da estação"

[[tables.estacao.raw.schema]]
name = "rio"
type = "string"
description = "rio monitorado"

[[tables.estacao.raw.schema]]
name = "uf"
type = "string"
description = "sigla da UF"

[[tables.estacao.raw.schema]]
name = "latitude"
type = "string"
description = "latitude (texto, como aterrissa)"

[[tables.estacao.raw.schema]]
name = "longitude"
type = "string"
description = "longitude (texto, como aterrissa)"

[[tables.estacao.raw.schema]]
name = "tipo"
type = "string"
description = "tipo da estação (fluviométrica, telemétrica)"

[[tables.estacao.bronze.schema]]
name = "codigo"
type = "string"
description = "código da estação (chave)"

[[tables.estacao.bronze.schema]]
name = "nome"
type = "string"
description = "nome da estação (espaçamento padronizado)"

[[tables.estacao.bronze.schema]]
name = "rio"
type = "string"
description = "rio monitorado"

[[tables.estacao.bronze.schema]]
name = "uf"
type = "string"
description = "sigla da UF"

[[tables.estacao.bronze.schema]]
name = "latitude"
type = "double"
description = "latitude em graus decimais"

[[tables.estacao.bronze.schema]]
name = "longitude"
type = "double"
description = "longitude em graus decimais"

[[tables.estacao.bronze.schema]]
name = "tipo"
type = "string"
description = "tipo da estação"

# ---------------------------------------------------------------------------
# ana_medicao_fluvio — medições fluviométricas diárias
# ---------------------------------------------------------------------------
[tables.medicao_fluvio]
name   = "ana_medicao_fluvio"
levels = ["raw", "bronze"]
key    = "codigo_estacao"

[[tables.medicao_fluvio.raw.schema]]
name = "codigo_estacao"
type = "string"
description = "código da estação (chave estrangeira)"

[[tables.medicao_fluvio.raw.schema]]
name = "data"
type = "string"
description = "data da medição (dd/MM/yyyy, texto)"

[[tables.medicao_fluvio.raw.schema]]
name = "nivel_cm"
type = "string"
description = "nível do rio em centímetros (texto)"

[[tables.medicao_fluvio.raw.schema]]
name = "vazao_m3s"
type = "string"
description = "vazão em m³/s (texto)"

[[tables.medicao_fluvio.raw.schema]]
name = "chuva_mm"
type = "string"
description = "precipitação em milímetros (texto)"

[[tables.medicao_fluvio.bronze.schema]]
name = "codigo_estacao"
type = "string"
description = "código da estação (chave estrangeira)"

[[tables.medicao_fluvio.bronze.schema]]
name = "data"
type = "date"
description = "data da medição"

[[tables.medicao_fluvio.bronze.schema]]
name = "nivel_cm"
type = "double"
description = "nível do rio em centímetros"

[[tables.medicao_fluvio.bronze.schema]]
name = "vazao_m3s"
type = "double"
description = "vazão em m³/s"

[[tables.medicao_fluvio.bronze.schema]]
name = "chuva_mm"
type = "double"
description = "precipitação em milímetros"

# ---------------------------------------------------------------------------
# ana_reservatorio — reservatórios monitorados
# ---------------------------------------------------------------------------
[tables.reservatorio]
name   = "ana_reservatorio"
