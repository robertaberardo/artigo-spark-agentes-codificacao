# -------------------------------------------------------------------------
# educacao_turma
# -------------------------------------------------------------------------
[tables.turma]
name   = "educacao_turma"
levels = ["raw"]
key    = "ID_UNIDADE"

[[tables.turma.raw.schema]]
name = "ID_UNIDADE"
type = "string"
description = "código da unidade escolar (chave)"

[[tables.turma.raw.schema]]
name = "TUR_BASICA"
type = "string"
description = "turmas da educação básica (total)"

# -------------------------------------------------------------------------
# educacao_escola_matricula — escolas consolidadas com matrículas e ponto (silver)
# -------------------------------------------------------------------------
[tables.escola_matricula]
name   = "educacao_escola_matricula"
levels = ["silver"]
key    = "id_unidade"

[[tables.escola_matricula.silver.schema]]
name = "id_unidade"
type = "string"
description = "código da unidade escolar (chave)"

[[tables.escola_matricula.silver.schema]]
name = "name"
type = "string"
description = "nome da unidade"

[[tables.escola_matricula.silver.schema]]
name = "uf"
type = "string"
description = "sigla da UF"

[[tables.escola_matricula.silver.schema]]
name = "cod_municipio"
type = "string"
description = "código IBGE do município"

[[tables.escola_matricula.silver.schema]]
name = "setor"
type = "string"
description = "setor administrativo (1 federal, 2 estadual, 3 municipal, 4 privada)"

[[tables.escola_matricula.silver.schema]]
name = "situacao"
type = "string"
description = "situação de funcionamento (1 em atividade, 2 paralisada, 3 extinta)"

[[tables.escola_matricula.silver.schema]]
name = "area"
type = "string"
description = "área (1 urbana, 2 rural)"

[[tables.escola_matricula.silver.schema]]
name = "total_enrollment"
type = "int"
description = "matrículas na educação básica (total), da tabela de matrículas"

[[tables.escola_matricula.silver.schema]]
name = "latitude"
type = "double"
description = "latitude em graus decimais (WGS84, preservada para medida geodésica)"

[[tables.escola_matricula.silver.schema]]
name = "longitude"
type = "double"
description = "longitude em graus decimais (WGS84, preservada para medida geodésica)"

[[tables.escola_matricula.silver.schema]]
name = "geometry"
type = "geometry(point)"
description = "ponto da escola (EPSG:3857)"

# -------------------------------------------------------------------------
# educacao_escola_matricula_h3_grid — grade H3 nível 5 das escolas federais (gold)
# -------------------------------------------------------------------------
[tables.escola_matricula_h3_grid]
name   = "educacao_escola_matricula_h3_grid"
levels = ["gold"]
key    = "h3_cell"

[[tables.escola_matricula_h3_grid.gold.schema]]
name = "h3_cell"
type = "long"
description = "id da célula H3 nível 5 (chave)"

[[tables.escola_matricula_h3_grid.gold.schema]]
name = "n_schools"
type = "long"
description = "escolas federais em atividade na célula"

[[tables.escola_matricula_h3_grid.gold.schema]]
name = "total_enrollment"
type = "long"
description = "total de matrículas (educação básica) das escolas da célula"

[[tables.escola_matricula_h3_grid.gold.schema]]
name = "avg_enrollment"
type = "double"
description = "média de matrículas por escola na célula (2 casas)"

[[tables.escola_matricula_h3_grid.gold.schema]]
name = "n_federal_neighbors"
type = "long"
description = "escolas federais em atividade vizinhas (na célula ou nas adjacentes), igual para toda a célula"

[[tables.escola_matricula_h3_grid.gold.schema]]
name = "avg_dist_neighbors_km"
type = "double"
description = "distância geodésica média de cada escola às suas vizinhas, em km (3 casas)"

[[tables.escola_matricula_h3_grid.gold.schema]]
name = "avg_dist_nearest_km"
type = "double"
description = "distância geodésica média de cada escola à federal mais próxima (qualquer), em km (3 casas)"

[[tables.escola_matricula_h3_grid.gold.schema]]
name = "geometry"
type = "geometry(polygon)"
description = "polígono da célula H3 (EPSG:3857)"
