[data_lake]
db  = "datalake"
app = "caged"

# ---------------------------------------------------------------------------
# caged_admissao — admissões no emprego formal
# ---------------------------------------------------------------------------
[tables.admissao]
name   = "caged_admissao"
levels = ["raw", "bronze"]
key    = "id"

[[tables.admissao.raw.schema]]
name = "id"
type = "string"
description = "identificador da movimentação (chave)"

[[tables.admissao.raw.schema]]
name = "municipio_ibge"
type = "string"
description = "código IBGE do município (texto)"

[[tables.admissao.raw.schema]]
name = "uf"
type = "string"
description = "sigla da UF"

[[tables.admissao.raw.schema]]
name = "cbo"
type = "string"
description = "código CBO da ocupação (texto)"

[[tables.admissao.raw.schema]]
name = "cnae"
type = "string"
description = "código CNAE da atividade econômica (texto)"

[[tables.admissao.raw.schema]]
name = "data"
type = "string"
description = "data da admissão (dd/MM/yyyy, texto)"

[[tables.admissao.raw.schema]]
name = "salario"
type = "string"
description = "salário de admissão (R$ 1.234,56, texto)"

[[tables.admissao.raw.schema]]
name = "sexo"
type = "string"
description = "sexo do trabalhador"

[[tables.admissao.bronze.schema]]
name = "id"
type = "string"
description = "identificador da movimentação (chave)"

[[tables.admissao.bronze.schema]]
name = "municipio_ibge"
type = "string"
description = "código IBGE do município (7 dígitos)"

[[tables.admissao.bronze.schema]]
name = "uf"
type = "string"
description = "sigla da UF"

[[tables.admissao.bronze.schema]]
name = "cbo"
type = "string"
description = "código CBO da ocupação (6 dígitos)"

[[tables.admissao.bronze.schema]]
name = "cnae"
type = "string"
description = "código CNAE da atividade econômica (7 dígitos)"

[[tables.admissao.bronze.schema]]
name = "data"
type = "date"
description = "data da admissão"

[[tables.admissao.bronze.schema]]
name = "salario"
type = "double"
description = "salário de admissão em reais"

[[tables.admissao.bronze.schema]]
name = "sexo"
type = "string"
description = "sexo do trabalhador"

