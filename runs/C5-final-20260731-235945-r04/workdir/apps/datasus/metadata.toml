[data_lake]
db  = "datalake"
app = "datasus"

# ---------------------------------------------------------------------------
# datasus_estabelecimento — cadastro dos estabelecimentos de saúde (CNES)
# ---------------------------------------------------------------------------
[tables.estabelecimento]
name   = "datasus_estabelecimento"
levels = ["raw", "bronze"]
key    = "co_cnes"

[[tables.estabelecimento.raw.schema]]
name = "co_cnes"
type = "string"
description = "código CNES do estabelecimento (chave)"

[[tables.estabelecimento.raw.schema]]
name = "nome"
type = "string"
description = "nome do estabelecimento"

[[tables.estabelecimento.raw.schema]]
name = "municipio_ibge"
type = "string"
description = "código IBGE do município"

[[tables.estabelecimento.raw.schema]]
name = "uf"
type = "string"
description = "sigla da UF"

[[tables.estabelecimento.raw.schema]]
name = "tipo"
type = "string"
description = "tipo de estabelecimento"

[[tables.estabelecimento.raw.schema]]
name = "latitude"
type = "string"
description = "latitude (texto, como aterrissa)"

[[tables.estabelecimento.raw.schema]]
name = "longitude"
type = "string"
description = "longitude (texto, como aterrissa)"

[[tables.estabelecimento.raw.schema]]
name = "leitos_sus"
type = "string"
description = "leitos disponíveis ao SUS (texto)"

[[tables.estabelecimento.bronze.schema]]
name = "co_cnes"
type = "string"
description = "código CNES do estabelecimento (chave)"

[[tables.estabelecimento.bronze.schema]]
name = "nome"
type = "string"
description = "nome do estabelecimento (espaçamento padronizado)"

[[tables.estabelecimento.bronze.schema]]
name = "municipio_ibge"
type = "string"
description = "código IBGE do município"

[[tables.estabelecimento.bronze.schema]]
name = "uf"
type = "string"
description = "sigla da UF"

[[tables.estabelecimento.bronze.schema]]
name = "tipo"
type = "string"
description = "tipo de estabelecimento"

[[tables.estabelecimento.bronze.schema]]
name = "latitude"
type = "double"
description = "latitude em graus decimais"

[[tables.estabelecimento.bronze.schema]]
name = "longitude"
type = "double"
description = "longitude em graus decimais"

[[tables.estabelecimento.bronze.schema]]
name = "leitos_sus"
type = "int"
description = "leitos disponíveis ao SUS"

# ---------------------------------------------------------------------------
# datasus_obito — óbitos registrados
# ---------------------------------------------------------------------------
[tables.obito]
name   = "datasus_obito"
levels = ["raw", "bronze"]
key    = "id"

[[tables.obito.raw.schema]]
name = "id"
type = "string"
description = "identificador do registro de óbito (chave)"

[[tables.obito.raw.schema]]
name = "municipio_ibge"
type = "string"
description = "código IBGE do município de residência"

[[tables.obito.raw.schema]]
name = "uf"
type = "string"
description = "sigla da UF"

[[tables.obito.raw.schema]]
name = "data_obito"
type = "string"
description = "data do óbito (dd/MM/yyyy, texto)"

[[tables.obito.raw.schema]]
name = "sexo"
type = "string"
description = "sexo"

[[tables.obito.raw.schema]]
name = "idade"
type = "string"
description = "idade em anos (texto)"

[[tables.obito.raw.schema]]
name = "causa_cid"
type = "string"
description = "causa básica (código CID-10)"

[[tables.obito.bronze.schema]]
name = "id"
type = "string"
description = "identificador do registro de óbito (chave)"

[[tables.obito.bronze.schema]]
name = "municipio_ibge"
type = "string"
description = "código IBGE do município de residência"

[[tables.obito.bronze.schema]]
name = "uf"
type = "string"
description = "sigla da UF"

[[tables.obito.bronze.schema]]
name = "data_obito"
type = "date"
description = "data do óbito"

[[tables.obito.bronze.schema]]
name = "sexo"
type = "string"
description = "sexo"

[[tables.obito.bronze.schema]]
name = "idade"
type = "int"
description = "idade em anos"

[[tables.obito.bronze.schema]]
name = "causa_cid"
type = "string"
description = "causa básica (código CID-10)"

